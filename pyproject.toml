[project]
name = "memhint"
version = "1.0.0"
description = "Finding Memory Leaks in C/C++ Programs via Neuro-Symbolic Augmented Static Analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# Pinned to the versions the measurements were taken with. Z3 in particular
# decides which summaries and which warnings survive, and the paper names
# 4.15.4.
dependencies = [
    "z3-solver==4.15.4.0",
    "tree-sitter==0.25.2",
    "tree-sitter-c==0.24.1",
    "tree-sitter-cpp==0.23.4",
    "google-cloud-aiplatform==1.133.0",
    "requests==2.28.1",
    "pyyaml==6.0.3",
    "tqdm==4.67.1",
]

[tool.uv]
package = false
